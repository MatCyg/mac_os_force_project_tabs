name: Build plugin

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide: ['2024.3.5', '2025.2.4', '2026.1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build against IntelliJ IDEA ${{ matrix.ide }}
        run: ./gradlew buildPlugin -PideVersion=${{ matrix.ide }} -PbuildJdkVersion=25 --no-daemon
